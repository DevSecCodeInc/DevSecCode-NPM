name: Release to npm

# Core-backed npm release. This workflow packages already-built
# DevSecCode-Core public/starter backend artifacts; it does not build the
# scanner engine, OpenGrep bundle, or a PyInstaller CLI binary in this
# repository.
#
# Required:
#   secrets.NPM_TOKEN              -- npm automation token for @devseccode/*
#   secrets.CORE_ARTIFACT_URL      -- optional default URL to a tar/zip bundle
#                                     containing devseccode-core-artifacts.json
#                                     and all referenced public/starter
#                                     platform archives.

on:
  push:
    tags:
      - "npm-v*"
  workflow_dispatch:
    inputs:
      core_artifact_url:
        description: "URL to public/starter Core artifact bundle (.tar.gz, .tgz, or .zip)"
        required: false
        default: ""
      dry_run:
        description: "Pack tarballs but skip npm publish"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      dist_tag:
        description: "npm dist-tag for publish"
        required: false
        default: "core-migration-canary"

jobs:
  package:
    name: Package public/starter Core artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Verify release ref and package versions
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          node - "$RELEASE_TAG" <<'JS'
          const fs = require("node:fs");
          const path = require("node:path");
          const targets = ["darwin-arm64", "linux-x64", "win32-x64"];
          const parent = JSON.parse(fs.readFileSync("npm-dist/packages/scanner/package.json", "utf8"));
          for (const target of targets) {
            const name = `@devseccode/scanner-${target}`;
            const file = path.join("npm-dist", "packages", `scanner-${target}`, "package.json");
            const platformPackage = JSON.parse(fs.readFileSync(file, "utf8"));
            if (platformPackage.version !== parent.version) {
              throw new Error(`${name} version ${platformPackage.version} does not match parent ${parent.version}`);
            }
            if (parent.optionalDependencies[name] !== parent.version) {
              throw new Error(`${name} optional dependency is not pinned to ${parent.version}`);
            }
          }
          const releaseTag = process.argv[2];
          if (releaseTag && releaseTag !== `npm-v${parent.version}`) {
            throw new Error(`release tag ${releaseTag} must equal npm-v${parent.version}`);
          }
          console.log(`release package version ${parent.version}`);
          JS

      - name: Verify Core launcher dependency is published
        shell: bash
        run: |
          node - <<'JS'
          const pkg = require("./npm-dist/packages/scanner/package.json");
          const version = pkg.dependencies && pkg.dependencies["@devseccode/core-launcher"];
          if (!version) {
            console.error("@devseccode/core-launcher dependency missing from parent package");
            process.exit(1);
          }
          console.log(version);
          JS
          VERSION="$(node -e 'process.stdout.write(require("./npm-dist/packages/scanner/package.json").dependencies["@devseccode/core-launcher"])')"
          npm view "@devseccode/core-launcher@$VERSION" version

      - name: Resolve artifact bundle URL
        id: artifact-url
        shell: bash
        env:
          INPUT_URL: ${{ github.event.inputs.core_artifact_url }}
          SECRET_URL: ${{ secrets.CORE_ARTIFACT_URL }}
        run: |
          URL="${INPUT_URL:-$SECRET_URL}"
          if [ -z "$URL" ]; then
            echo "::error::Set workflow input core_artifact_url or secret CORE_ARTIFACT_URL."
            exit 2
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Download public/starter Core artifact bundle
        shell: bash
        run: |
          mkdir -p npm-dist/_core-artifacts
          curl -L "${{ steps.artifact-url.outputs.url }}" -o npm-dist/_core-artifacts/core-artifacts.bundle
          file npm-dist/_core-artifacts/core-artifacts.bundle

      - name: Extract public/starter Core artifact bundle
        shell: bash
        run: |
          mkdir -p npm-dist/_core-artifacts/extracted
          python3 npm-dist/scripts/extract-core-artifact-bundle.py \
            npm-dist/_core-artifacts/core-artifacts.bundle \
            npm-dist/_core-artifacts/extracted
          find npm-dist/_core-artifacts/extracted -maxdepth 3 -type f -print

      - name: Locate public/starter Core artifact manifest
        id: core-artifacts
        shell: bash
        run: |
          MANIFEST="$(find npm-dist/_core-artifacts/extracted -name devseccode-core-artifacts.json -type f | head -n1)"
          if [ -z "$MANIFEST" ]; then
            echo "::error::devseccode-core-artifacts.json not found in bundle."
            exit 1
          fi
          if [ ! -f "$MANIFEST.sig" ]; then
            echo "::error::devseccode-core-artifacts.json.sig not found beside manifest."
            exit 1
          fi
          DIR="$(dirname "$MANIFEST")"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Verify signed Core artifact manifest
        shell: bash
        run: |
          node - "${{ steps.core-artifacts.outputs.dir }}/devseccode-core-artifacts.json" <<'JS'
          const { verifyManifestSignature } = require("./npm-dist/packages/scanner/lib/artifact-trust");
          verifyManifestSignature(process.argv[2]);
          console.log("Core artifact manifest signature verified");
          JS

      - name: Validate target coverage
        shell: bash
        run: |
          node - "${{ steps.core-artifacts.outputs.dir }}/devseccode-core-artifacts.json" <<'JS'
          const fs = require("node:fs");
          const manifest = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const have = new Set((manifest.artifacts || []).map((item) => item.target));
          const required = ["darwin-arm64", "linux-x64", "win32-x64"];
          const missing = required.filter((target) => !have.has(target));
          if (missing.length) {
            console.error(`Missing public/starter Core artifact targets: ${missing.join(", ")}`);
            process.exit(1);
          }
          JS

      - name: Validate public/starter artifact profile
        shell: bash
        run: |
          for target in darwin-arm64 linux-x64 win32-x64; do
            node npm-dist/scripts/validate-public-core-artifact.js \
              "${{ steps.core-artifacts.outputs.dir }}/devseccode-core-artifacts.json" \
              "${{ steps.core-artifacts.outputs.dir }}" \
              "$target"
          done

      - name: Verify no generated Core payload is tracked
        shell: bash
        run: |
          if git ls-files 'npm-dist/packages/scanner-*/artifacts/*' | grep -v '/.gitkeep$' | grep -q .; then
            echo "::error::Generated Core payloads must be assembled in CI, not committed."
            git ls-files 'npm-dist/packages/scanner-*/artifacts/*' | grep -v '/.gitkeep$'
            exit 1
          fi

      - name: Assemble platform packages
        shell: bash
        run: |
          for target in darwin-arm64 linux-x64 win32-x64; do
            bash npm-dist/scripts/assemble-platform-pkg.sh "$target" "${{ steps.core-artifacts.outputs.dir }}"
          done

      - name: Run parent package tests
        shell: bash
        run: node --test npm-dist/packages/scanner/test/*.test.js

      - name: Package dry run
        shell: bash
        run: |
          export npm_config_cache="$RUNNER_TEMP/npm-cache"
          ( cd npm-dist/packages/scanner && npm pack --dry-run )
          for target in darwin-arm64 linux-x64 win32-x64; do
            ( cd "npm-dist/packages/scanner-$target" && npm pack --dry-run )
          done

      - name: Fresh install smoke with packaged Linux public/starter Core artifact
        shell: bash
        run: |
          export npm_config_cache="$RUNNER_TEMP/npm-cache"
          DSC_CORE_TARGET=linux-x64 \
            DSC_CORE_ARTIFACT_DIR="${{ steps.core-artifacts.outputs.dir }}" \
            bash npm-dist/scripts/test-local-install.sh

      - uses: actions/upload-artifact@v4
        with:
          name: npm-core-packages
          path: npm-dist/packages/
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: [package]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          name: npm-core-packages
          path: npm-dist/packages/

      - name: Publish
        if: github.event_name == 'push' || github.event.inputs.dry_run == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISH_TAG: ${{ github.event.inputs.dist_tag || 'core-migration-canary' }}
        shell: bash
        run: bash npm-dist/scripts/publish-all.sh

      - name: Dry-run publish
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISH_TAG: ${{ github.event.inputs.dist_tag || 'core-migration-canary' }}
        shell: bash
        run: bash npm-dist/scripts/publish-all.sh --dry-run
