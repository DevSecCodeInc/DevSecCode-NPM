name: Build NPM artifact-v2 candidate

on:
  workflow_dispatch:
    inputs:
      npm_ref:
        description: Exact 40-character NPM main commit to package
        required: true
        type: string
      core_version:
        description: Accepted Core version
        required: true
        default: 0.3.6
        type: string
      core_ref:
        description: Exact accepted Core source commit
        required: true
        type: string
      core_candidate_id:
        description: Exact accepted Core artifact-v2 candidate ID
        required: true
        type: string

concurrency:
  group: npm-v2-candidate-${{ inputs.npm_ref }}-${{ inputs.core_candidate_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.npm_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify immutable product and Core identity
        env:
          NPM_REF: ${{ inputs.npm_ref }}
          CORE_VERSION: ${{ inputs.core_version }}
          CORE_REF: ${{ inputs.core_ref }}
          CORE_CANDIDATE_ID: ${{ inputs.core_candidate_id }}
        run: |
          [[ "$NPM_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CORE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CORE_CANDIDATE_ID" =~ ^${CORE_REF}-run-[1-9][0-9]*-attempt-[1-9][0-9]*$ ]]
          test "$GITHUB_SHA" = "$NPM_REF"
          test "$(git rev-parse HEAD)" = "$NPM_REF"
          git merge-base --is-ancestor "$NPM_REF" origin/main
          node - "$CORE_VERSION" <<'JS'
          const fs = require("node:fs");
          const path = require("node:path");
          const targets = ["darwin-arm64", "linux-x64", "linux-arm64", "win32-x64"];
          const parent = JSON.parse(fs.readFileSync("npm-dist/packages/scanner/package.json", "utf8"));
          if (parent.version !== "0.5.0") throw new Error(`unexpected NPM candidate version ${parent.version}`);
          if (parent.dependencies["@devseccode/core-launcher"] !== "0.6.0") throw new Error("Core launcher pin mismatch");
          if (parent.engines.node !== "^22.0.0 || ^24.0.0") throw new Error("Node support contract mismatch");
          for (const target of targets) {
            const name = `@devseccode/scanner-${target}`;
            const platform = JSON.parse(fs.readFileSync(path.join("npm-dist/packages", `scanner-${target}`, "package.json"), "utf8"));
            if (platform.version !== parent.version || parent.optionalDependencies[name] !== parent.version) {
              throw new Error(`${name} is not exactly pinned to ${parent.version}`);
            }
          }
          if (process.argv[2] !== "0.3.6") throw new Error(`unexpected Core version ${process.argv[2]}`);
          JS

      - name: Install exact Core launcher
        run: |
          npm install \
            --prefix npm-dist/packages/scanner \
            --package-lock=false \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --omit=optional
          test "$(node -p "require('./npm-dist/packages/scanner/node_modules/@devseccode/core-launcher/package.json').version")" = "0.6.0"

      - name: Download accepted public-starter Core candidate
        env:
          CORE_VERSION: ${{ inputs.core_version }}
          CORE_REF: ${{ inputs.core_ref }}
          CORE_CANDIDATE_ID: ${{ inputs.core_candidate_id }}
        run: |
          node npm-dist/scripts/download-public-core-candidate.mjs \
            npm-dist/_core-artifacts \
            "$CORE_VERSION" \
            "$CORE_REF" \
            "$CORE_CANDIDATE_ID"

      - name: Validate public-starter profile and assemble platform packages
        run: |
          for target in darwin-arm64 linux-x64 linux-arm64 win32-x64; do
            node npm-dist/scripts/validate-public-core-artifact.js \
              npm-dist/_core-artifacts/devseccode-core-artifacts.json \
              npm-dist/_core-artifacts \
              "$target"
            bash npm-dist/scripts/assemble-platform-pkg.sh "$target" npm-dist/_core-artifacts
          done
          if git ls-files 'npm-dist/packages/scanner-*/artifacts/*' | grep -v '/.gitkeep$' | grep -q .; then
            echo "::error::Generated Core payloads must not be committed."
            exit 1
          fi

      - name: Run NPM tests
        run: node --test npm-dist/packages/scanner/test/*.test.js

      - name: Pack exact candidate tarballs and release record
        env:
          NPM_REF: ${{ inputs.npm_ref }}
          CORE_VERSION: ${{ inputs.core_version }}
          CORE_REF: ${{ inputs.core_ref }}
          CORE_CANDIDATE_ID: ${{ inputs.core_candidate_id }}
        run: |
          candidate="$RUNNER_TEMP/npm-candidate"
          mkdir -p "$candidate/core"
          for target in darwin-arm64 linux-x64 linux-arm64 win32-x64; do
            npm pack "npm-dist/packages/scanner-$target" --pack-destination "$candidate"
          done
          npm pack npm-dist/packages/scanner --pack-destination "$candidate"
          cp npm-dist/_core-artifacts/devseccode-core-artifacts.json "$candidate/core/"
          cp npm-dist/_core-artifacts/devseccode-core-artifacts.json.sig "$candidate/core/"
          launcher_integrity="$(npm view @devseccode/core-launcher@0.6.0 dist.integrity)"
          CORE_LAUNCHER_INTEGRITY="$launcher_integrity" \
            node npm-dist/scripts/npm-candidate-record.mjs \
              create "$candidate" 0.5.0 "$NPM_REF" \
              "$CORE_VERSION" "$CORE_REF" "$CORE_CANDIDATE_ID"
          node npm-dist/scripts/npm-candidate-record.mjs \
            verify "$candidate" 0.5.0 "$NPM_REF" \
            "$CORE_VERSION" "$CORE_REF" "$CORE_CANDIDATE_ID"
          node npm-dist/scripts/audit-public-candidate.mjs "$candidate"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-artifact-v2-candidate
          path: ${{ runner.temp }}/npm-candidate/
          if-no-files-found: error
          retention-days: 30

      - name: Record candidate summary
        env:
          NPM_REF: ${{ inputs.npm_ref }}
          CORE_VERSION: ${{ inputs.core_version }}
          CORE_REF: ${{ inputs.core_ref }}
          CORE_CANDIDATE_ID: ${{ inputs.core_candidate_id }}
        run: |
          {
            echo "## NPM artifact-v2 candidate"
            echo "- NPM source: \`$NPM_REF\`"
            echo "- NPM version: \`0.5.0\`"
            echo "- Core version: \`$CORE_VERSION\`"
            echo "- Core source: \`$CORE_REF\`"
            echo "- Core candidate: \`$CORE_CANDIDATE_ID\`"
            echo "- Published: no"
          } >> "$GITHUB_STEP_SUMMARY"

  private-acceptance:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-22.04
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: darwin-arm64
            os: macos-15
          - target: win32-x64
            os: ${{ vars.CORE_V2_WINDOWS11_X64_RUNNER_LABEL }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.npm_ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-artifact-v2-candidate
          path: ${{ runner.temp }}/npm-candidate

      - name: Install and exercise exact private candidate bytes
        env:
          DEVSECCODE_NPM_CANDIDATE_VERSION: 0.5.0
          DEVSECCODE_NPM_CANDIDATE_DIR: ${{ runner.temp }}/npm-candidate
          DEVSECCODE_NPM_SOURCE_COMMIT: ${{ inputs.npm_ref }}
        run: node npm-dist/scripts/candidate-platform-test.mjs start-private

      - name: Uninstall and remove isolated candidate state
        if: always()
        env:
          DEVSECCODE_NPM_CANDIDATE_VERSION: 0.5.0
        run: node npm-dist/scripts/candidate-platform-test.mjs cleanup
