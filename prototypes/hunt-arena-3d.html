<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DevSecCode — 3D Hunt (find the vulnerabilities)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" />
<style>
  :root{
    --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --border-radius-md:8px; --border-radius-lg:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:24px;background:#06070e;color:#cfd2e6;font-family:var(--font-sans);display:flex;justify-content:center}
  .arena-wrap{width:100%;max-width:680px}
  .frame{position:relative;background:#0a0b14;border:0.5px solid #2a2d44;border-radius:var(--border-radius-lg);overflow:hidden;color:#cfd2e6}
  .hud{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#0e1020;border-bottom:0.5px solid #23263c;flex-wrap:wrap}
  .hud .sigil{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#0a0b14;background:var(--accent,#9b8cff);font-weight:500}
  .hud select{background:#15182b;color:#e7e9f7;border:0.5px solid #2c3050;border-radius:6px;height:28px;font-size:12px;padding:0 6px;font-family:inherit}
  .hud .name{font-size:13px;font-weight:500;color:#fff;line-height:1.1}
  .hud .title{font-size:11px;color:#8b8fb0}
  .xpwrap{flex:1;min-width:96px}
  .xprow{display:flex;justify-content:space-between;font-size:11px;color:#9a9ec2;margin-bottom:3px}
  .xptrack{height:7px;background:#1b1e34;border-radius:4px;overflow:hidden}
  .xpfill{height:100%;width:60%;background:var(--accent,#9b8cff);transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .fams{display:flex;gap:5px}
  .fam{display:flex;align-items:center;gap:4px;font-size:11px;color:#aeb2d4;background:#15182b;border:0.5px solid #262a44;border-radius:6px;padding:3px 7px}
  .fam b{font-weight:500;color:#fff}
  .fam .g{font-family:var(--font-mono);color:#7e84ad}
  .prog{font-size:11px;color:#9094b6;white-space:nowrap}
  .stage{position:relative;height:460px;width:100%}
  .stage canvas#cv{display:block;width:100%;height:100%;cursor:grab}
  #labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .flab{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;font-family:var(--font-mono);font-size:11px;padding:2px 7px;border-radius:6px;background:rgba(10,11,20,.7);border:0.5px solid rgba(255,255,255,.16);color:#cdd2ee;white-space:nowrap;user-select:none}
  .flab:hover{background:rgba(40,44,72,.92);color:#fff}
  .maphint{position:absolute;left:11px;top:10px;max-width:62%;line-height:1.4;font-size:11px;color:#8388ad;background:rgba(10,11,20,.55);padding:3px 8px;border-radius:8px}
  .deva{position:absolute;left:11px;bottom:11px;max-width:58%;font-size:12px;color:#bcb6ff;font-style:italic;text-shadow:0 1px 6px #000}
  .deva b{font-style:normal;font-weight:500;color:#9b8cff}
  .runbar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%)}
  .runbar button{cursor:pointer;font-family:inherit;height:38px;padding:0 18px;border-radius:9px;font-size:13px;font-weight:500;border:0.5px solid var(--accent,#9b8cff);background:rgba(155,140,255,.16);color:#e7e3ff;display:flex;align-items:center;gap:7px}
  .runbar button:hover{background:rgba(155,140,255,.28)}
  .filepanel{position:absolute;inset:8px;background:rgba(9,10,18,.97);border:0.5px solid #2c3052;border-radius:10px;display:none;flex-direction:column;overflow:hidden}
  .fp-head{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:0.5px solid #23263c;background:#0e1020}
  .fp-path{font-family:var(--font-mono);font-size:13px;color:#fff;font-weight:500}
  .fp-back{margin-left:auto;cursor:pointer;font-family:inherit;height:28px;padding:0 12px;border-radius:7px;font-size:12px;border:0.5px solid #2e3253;background:#15182b;color:#c9cdf0}
  .fp-back:hover{background:#1d2138}
  .fp-hint{font-size:11px;color:#8b90b4;padding:6px 12px 2px}
  .code{flex:1;overflow-y:auto;padding:6px 0;font-family:var(--font-mono);font-size:12.5px;line-height:1.62}
  .cl{display:flex;align-items:flex-start;padding:1px 10px;cursor:pointer;border-left:2px solid transparent}
  .cl:hover{background:rgba(255,255,255,.045)}
  .cl .ln{width:28px;flex-shrink:0;color:#565c7e;text-align:right;padding-right:12px;user-select:none}
  .cl .cd{white-space:pre;color:#c4c8ea}
  .cl .cd.cmt{color:#6f7497}
  .cl.flag{background:rgba(155,140,255,.14);border-left-color:var(--accent,#9b8cff)}
  .cl.hit{background:rgba(72,201,135,.14);border-left-color:#48c987}
  .cl.miss{background:rgba(226,75,74,.15);border-left-color:#e24b4a}
  .cl.fp{background:rgba(217,155,46,.14);border-left-color:#d99b2e}
  .tg{margin-left:10px;font-family:var(--font-sans);font-size:11px;padding:0 7px;border-radius:9px;line-height:18px;height:18px;align-self:center}
  .tgh{background:#143a28;color:#9ff0bd}.tgm{background:#3a1c1c;color:#f0a3a3}.tgf{background:#3a3017;color:#ecc98a}
  .fp-foot{padding:8px 12px;border-top:0.5px solid #23263c;font-size:11px;color:var(--accent,#9b8cff);min-height:32px}
  .toasts{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
  .toast{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:500;color:#0a0b14;background:#ffd76b;padding:6px 12px;border-radius:20px;animation:pop .35s ease}
  .toast.ach{background:#9b8cff}
  @keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.9)}to{opacity:1;transform:none}}
  .scorepanel{position:absolute;inset:0;background:rgba(6,7,15,.95);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;gap:11px;overflow-y:auto}
  .grade{font-size:46px;font-weight:500;color:#fff;line-height:1}
  .metrics{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .mc{background:#15182b;border:0.5px solid #2a2e4a;border-radius:8px;padding:8px 14px;min-width:74px}
  .mn{font-size:18px;font-weight:500;color:#fff}.ml{font-size:11px;color:#9094b6}
  .fchips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .fc{font-size:11px;color:#aeb2d4;background:#15182b;border:0.5px solid #262a44;border-radius:6px;padding:3px 7px}
  .fc .g{font-family:var(--font-mono);color:#7e84ad;margin-right:4px}
  .srlist{display:flex;flex-direction:column;gap:4px;max-height:150px;overflow-y:auto;width:100%;max-width:430px}
  .sr{font-size:12px;display:flex;align-items:center;gap:8px;background:#10131f;border-radius:6px;padding:5px 9px;text-align:left;color:#c9cdea}
  .sr .mono{font-family:var(--font-mono);font-size:11px;color:#8e93b6;margin-left:auto}
  .sd{font-size:12px;color:#bcb6ff;font-style:italic}
  .sbtn{display:flex;gap:8px}
  .sbtn button{cursor:pointer;font-family:inherit;height:34px;padding:0 14px;border-radius:8px;font-size:12px;font-weight:500;border:0.5px solid #3a3e63;background:#1a1d33;color:#dfe2f7;display:flex;align-items:center;gap:6px}
  .legend{display:flex;gap:12px;flex-wrap:wrap;padding:8px 12px;background:#0e1020;border-top:0.5px solid #23263c;font-size:11px;color:#9094b6}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
</style>
</head>
<body>
<div class="arena-wrap">
  <div class="frame" id="frame" style="--accent:#9b8cff">
    <div class="hud">
      <div class="sigil" id="sigil">&#9673;</div>
      <select id="hunter" aria-label="Choose hunter"></select>
      <div>
        <div class="name" id="hname">Deva</div>
        <div class="title" id="htitle">The Watcher</div>
      </div>
      <div class="xpwrap">
        <div class="xprow"><span id="lvl">Level 4</span><span id="xptxt">60 / 100 XP</span></div>
        <div class="xptrack"><div class="xpfill" id="xpfill"></div></div>
      </div>
      <div class="fams" id="fams"></div>
      <div class="prog" id="progress">Files 0/8</div>
    </div>

    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div id="labels"></div>
      <div class="maphint">Click a file to open it &middot; read the code &middot; flag the lines you suspect</div>
      <div class="toasts" id="toasts"></div>
      <div class="deva" id="deva"><b>Deva:</b> Walk the files. Find what does not belong.</div>
      <div class="runbar" id="runbar"><button id="runbtn"><i class="ti ti-radar"></i> Run the scanner</button></div>
      <div class="filepanel" id="filepanel">
        <div class="fp-head"><span class="fp-path" id="fpath"></span><button class="fp-back" id="fback">Back to map</button></div>
        <div class="fp-hint" id="fhint"></div>
        <div class="code" id="code"></div>
        <div class="fp-foot" id="fcount"></div>
      </div>
      <div class="scorepanel" id="scorepanel"></div>
    </div>

    <div class="legend">
      <span><i style="background:#ff3b3b"></i>Critical</span>
      <span><i style="background:#ff7849"></i>High</span>
      <span><i style="background:#ffc24b"></i>Medium</span>
      <span><i style="background:#4d9bff"></i>Low</span>
      <span><i style="background:#9aa0b5"></i>Info</span>
      <span style="margin-left:auto;color:#6f7398">scored vs <span style="font-family:var(--font-mono)">dsc</span> findings &middot; prototype</span>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  function boot(){
  if(!window.THREE){ document.getElementById('deva').innerHTML='<b>Deva:</b> the arena could not load (WebGL/CDN blocked).'; return; }
  var T=window.THREE;

  var SEV={
    CRITICAL:{tag:'critical',color:'#ff3b3b',xp:25}, HIGH:{tag:'high',color:'#ff7849',xp:15},
    MEDIUM:{tag:'medium',color:'#ffc24b',xp:8}, LOW:{tag:'low',color:'#4d9bff',xp:3}, INFO:{tag:'info',color:'#9aa0b5',xp:1}
  };
  var FAM={ secrets:'*', injection:'+', crypto:'#', container:'@', misc:'~' };
  var HUNTERS=[
    {key:'deva',name:'Deva',title:'The Watcher',glyph:'◉',accent:'#9b8cff'},
    {key:'knight',name:'Knight',title:'The Shield',glyph:'♞',accent:'#5ad1ff'},
    {key:'rogue',name:'Rogue',title:'The Shadow',glyph:'♦',accent:'#76e0a0'},
    {key:'mage',name:'Mage',title:'The Cipher',glyph:'★',accent:'#ffe06b'},
    {key:'scout',name:'Scout',title:'The Pathfinder',glyph:'▸',accent:'#ff7a7a'},
    {key:'sentinel',name:'Sentinel',title:'The Warden',glyph:'◆',accent:'#6fa8ff'}
  ];

  var FILES=[
    {path:'api/users.py', lines:[
      'from db import cursor','from flask import request','',
      'def get_user():','    req = request.args','    # look up the requested account',
      '    cur = cursor()','    cur.execute("SELECT * FROM users WHERE id=" + req.get("id"))',
      '    row = cur.fetchone()','    return row'],
      vulns:[{line:8,enemy:'SQL Hydra',cwe:'CWE-89',sev:'CRITICAL',fam:'injection',rule:'deva.cwe-89.python-sql-injection',fix:'Use a parameterized query instead of string concatenation.'}]},
    {path:'config/settings.py', lines:[
      'import os','','DEBUG = os.getenv("DEBUG", "0") == "1"','DB_HOST = os.getenv("DB_HOST", "localhost")',
      '# service credentials','AWS_SECRET = "wJalrXUtnFEMI/K7MDENG/bPxRfiCY"','REGION = "us-east-1"','REQUEST_TIMEOUT = 30'],
      vulns:[{line:6,enemy:'Credential Goblin',cwe:'CWE-798',sev:'HIGH',fam:'secrets',rule:'deva.cwe-798.generic-hardcoded-secret',fix:'Load the key from an env var or secrets manager.'}]},
    {path:'web/views.js', lines:[
      'export function render(req, el) {','  const name = req.query.name;','  // greet the visitor by name',
      '  el.innerHTML = "Hello " + name;','  el.classList.add("greeting");','  return el;','}'],
      vulns:[{line:4,enemy:'XSS Wraith',cwe:'CWE-79',sev:'HIGH',fam:'injection',rule:'deva.cwe-79.javascript-xss',fix:'Use textContent or escape the value before insertion.'}]},
    {path:'auth/hash.py', lines:[
      'import hashlib','','def hash_password(pw):','    # derive a stored digest',
      '    digest = hashlib.md5(pw.encode()).hexdigest()','    return digest'],
      vulns:[{line:5,enemy:'Hash Ghoul',cwe:'CWE-327',sev:'MEDIUM',fam:'crypto',rule:'deva.cwe-327.weak-hash',fix:'Use bcrypt, scrypt, or argon2 for password hashing.'}]},
    {path:'Dockerfile', lines:[
      'FROM node:20','WORKDIR /app','COPY . .','RUN npm ci','USER root','EXPOSE 3000','CMD ["node", "server.js"]'],
      vulns:[{line:5,enemy:'Privilege Wyvern',cwe:'CWE-250',sev:'LOW',fam:'container',rule:'deva.cwe-250.docker-root',fix:'Run as a non-root USER before the entrypoint.'}]},
    {path:'jobs/worker.py', lines:[
      'import pickle','','def handle(message):','    # decode the queued job payload',
      '    data = pickle.loads(message.body)','    return run(data)'],
      vulns:[{line:5,enemy:'Rogue Bit',cwe:'CWE-502',sev:'INFO',fam:'misc',rule:'deva.cwe-502.python-deserialize',fix:'Avoid native deserialization of untrusted input.'}]},
    {path:'lib/strings.py', lines:[
      'def slugify(s):','    out = s.strip().lower()','    out = out.replace(" ", "-")','    return out','',
      'def truncate(s, n):','    return s if len(s) <= n else s[:n] + "..."'], vulns:[]},
    {path:'health/ping.py', lines:[
      'from flask import jsonify','','def ping():','    # liveness probe','    return jsonify({"status": "ok"})'], vulns:[]}
  ];
  var TOTAL_VULN=FILES.reduce(function(a,f){return a+f.vulns.length;},0);

  var state={totalXp:460,fams:{secrets:0,injection:0,crypto:0,container:0,misc:0},firstBlood:false,veteran:false,hunter:HUNTERS[0],view:'map',cur:-1,scored:false};
  FILES.forEach(function(f){f.flags={}; f.seen=false; f.node=null; f.el=null; f.res=null;});

  var stage=document.getElementById('stage');
  var W=stage.clientWidth||680, H=stage.clientHeight||460;
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function flagCount(f){return Object.keys(f.flags).length;}
  function totalFlags(){return FILES.reduce(function(a,f){return a+flagCount(f);},0);}
  function seenCount(){return FILES.filter(function(f){return f.seen;}).length;}

  var scene=new T.Scene();
  scene.fog=new T.FogExp2(0x06070f,0.028);
  var camera=new T.PerspectiveCamera(50,W/H,0.1,200);
  var renderer=new T.WebGLRenderer({canvas:document.getElementById('cv'),antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.setSize(W,H,false); renderer.setClearColor(0x06070f,1);

  scene.add(new T.AmbientLight(0x32365a,0.7));
  var devaLight=new T.PointLight(0x9b8cff,1.3,44); devaLight.position.set(0,5,0); scene.add(devaLight);
  var fillL=new T.DirectionalLight(0xaab4ff,0.3); fillL.position.set(6,10,4); scene.add(fillL);

  for(var gr=2;gr<=7;gr+=2.5){
    var rg=new T.Mesh(new T.RingGeometry(gr-0.02,gr+0.02,80),new T.MeshBasicMaterial({color:0x222746,side:T.DoubleSide,transparent:true,opacity:0.4}));
    rg.rotation.x=-Math.PI/2; rg.position.y=-0.5; scene.add(rg);
  }

  var Np=620, ppos=new Float32Array(Np*3);
  for(var i=0;i<Np;i++){var a=Math.random(),b=Math.random(),th=2*Math.PI*a,ph=Math.acos(2*b-1),r=1.0+Math.random()*0.12;
    ppos[i*3]=r*Math.sin(ph)*Math.cos(th);ppos[i*3+1]=r*Math.cos(ph);ppos[i*3+2]=r*Math.sin(ph)*Math.sin(th);}
  var pg=new T.BufferGeometry();pg.setAttribute('position',new T.BufferAttribute(ppos,3));
  var deva=new T.Points(pg,new T.PointsMaterial({color:0x9b8cff,size:0.07,transparent:true,opacity:0.9,blending:T.AdditiveBlending,depthWrite:false}));
  deva.position.set(0,2.7,0); scene.add(deva);

  var labelsEl=document.getElementById('labels');
  function buildNodes(){
    FILES.forEach(function(f,idx){
      var ang=idx*(2*Math.PI/FILES.length)-Math.PI/2, rad=5.3;
      var g=new T.Group();
      var mat=new T.MeshStandardMaterial({color:0x141829,emissive:new T.Color('#2a3050'),emissiveIntensity:0.55,metalness:0.3,roughness:0.5});
      var box=new T.Mesh(new T.BoxGeometry(1.15,1.5,0.13),mat); g.add(box);
      var edge=new T.LineSegments(new T.EdgesGeometry(new T.BoxGeometry(1.15,1.5,0.13)),new T.LineBasicMaterial({color:new T.Color('#3a4570')}));
      g.add(edge);
      g.position.set(Math.cos(ang)*rad,1.3,Math.sin(ang)*rad);
      g.lookAt(0,1.3,0);
      g.userData={idx:idx,mat:mat,edge:edge,baseY:1.3,phase:idx*0.7};
      scene.add(g); f.node=g;
      var el=document.createElement('div'); el.className='flab';
      el.textContent=f.path; el.addEventListener('click',function(e){e.stopPropagation(); if(state.view==='map'||state.view==='score')enterFile(idx);});
      labelsEl.appendChild(el); f.el=el;
    });
  }

  var az=0.6, pol=0.92, dist=14, down=false, moved=false, lx=0, ly=0;
  function applyCam(){camera.position.set(Math.sin(az)*Math.sin(pol)*dist,Math.cos(pol)*dist,Math.cos(az)*Math.sin(pol)*dist);camera.lookAt(0,1.0,0);}
  var cv=document.getElementById('cv');
  cv.addEventListener('pointerdown',function(e){if(state.view!=='map'&&state.view!=='score')return;down=true;moved=false;lx=e.clientX;ly=e.clientY;});
  window.addEventListener('pointerup',function(e){ if(down&&!moved)mapClick(e); down=false; });
  window.addEventListener('pointermove',function(e){ if(!down)return; if(Math.abs(e.clientX-lx)+Math.abs(e.clientY-ly)>4)moved=true; if(moved){az-=(e.clientX-lx)*0.006;pol=Math.max(0.5,Math.min(1.25,pol-(e.clientY-ly)*0.005));lx=e.clientX;ly=e.clientY;} });
  cv.addEventListener('wheel',function(e){if(state.view!=='map'&&state.view!=='score')return;e.preventDefault();dist=Math.max(9,Math.min(22,dist+(e.deltaY>0?1:-1)*0.8));},{passive:false});

  var rc=new T.Raycaster(), mvec=new T.Vector2();
  function mapClick(e){
    if(state.view!=='map'&&state.view!=='score')return;
    var r=cv.getBoundingClientRect(); mvec.x=((e.clientX-r.left)/r.width)*2-1; mvec.y=-((e.clientY-r.top)/r.height)*2+1; rc.setFromCamera(mvec,camera);
    var hits=rc.intersectObjects(FILES.map(function(f){return f.node;}),true);
    if(hits.length){var o=hits[0].object;while(o&&o.userData.idx===undefined)o=o.parent; if(o)enterFile(o.userData.idx);}
  }

  function enterFile(idx){
    state.cur=idx; var f=FILES[idx]; f.seen=true;
    var review=state.scored;
    document.getElementById('fpath').textContent=f.path;
    document.getElementById('fhint').textContent=review?'Review — vulnerable lines revealed':'Click any line you believe is vulnerable';
    var truth={}; f.vulns.forEach(function(v){truth[v.line]=v;});
    var rows='';
    f.lines.forEach(function(ln,k){
      var no=k+1, flagged=!!f.flags[no], isV=!!truth[no], cls='cl', tag='';
      var trimmed=ln.replace(/^\s+/,'');
      var cmt=(trimmed.indexOf('#')===0||trimmed.indexOf('//')===0)?' cmt':'';
      if(review){ if(isV&&flagged){cls+=' hit';tag='<span class="tg tgh">caught</span>';}
        else if(isV&&!flagged){cls+=' miss';tag='<span class="tg tgm">missed</span>';}
        else if(!isV&&flagged){cls+=' fp';tag='<span class="tg tgf">false</span>';} }
      else if(flagged){cls+=' flag';}
      rows+='<div class="'+cls+'" data-ln="'+no+'"><span class="ln">'+no+'</span><span class="cd'+cmt+'">'+(esc(ln)||' ')+'</span>'+tag+'</div>';
    });
    var code=document.getElementById('code'); code.innerHTML=rows;
    if(!review){
      [].forEach.call(code.querySelectorAll('.cl'),function(row){
        row.addEventListener('click',function(){
          var no=+row.getAttribute('data-ln');
          if(f.flags[no]){delete f.flags[no];row.classList.remove('flag');}
          else{f.flags[no]=true;row.classList.add('flag');}
          document.getElementById('fcount').textContent=flagCount(f)+' flagged';
          updateProgress();
        });
      });
    }
    document.getElementById('fcount').textContent=review?'':(flagCount(f)+' flagged');
    document.getElementById('fback').textContent=review?'Back to score':'Back to map';
    state.view='file';
    document.getElementById('filepanel').style.display='flex';
    updateProgress();
  }
  function backFromFile(){
    document.getElementById('filepanel').style.display='none';
    if(state.scored){state.view='score';document.getElementById('scorepanel').style.display='flex';}
    else{state.view='map';}
  }

  var bursts=[], reveals=[];
  function burst(p,col,count){
    var n=count||40,bp=new Float32Array(n*3),vel=[];
    for(var k=0;k<n;k++){bp[k*3]=p.x;bp[k*3+1]=p.y;bp[k*3+2]=p.z;var a=Math.random()*Math.PI*2,e=Math.random()*Math.PI,sp=2+Math.random()*3;
      vel.push([Math.sin(e)*Math.cos(a)*sp,Math.cos(e)*sp+1.5,Math.sin(e)*Math.sin(a)*sp]);}
    var bg=new T.BufferGeometry();bg.setAttribute('position',new T.BufferAttribute(bp,3));
    var pts=new T.Points(bg,new T.PointsMaterial({color:new T.Color(col),size:0.16,transparent:true,opacity:1,blending:T.AdditiveBlending,depthWrite:false}));
    scene.add(pts);bursts.push({pts:pts,vel:vel,life:0});
  }
  function monsterMesh(fam,col){
    var g=new T.Group(); var mat=new T.MeshStandardMaterial({color:0x161a2c,emissive:new T.Color(col),emissiveIntensity:0.7,metalness:0.3,roughness:0.45});
    function add(geo,x,y,z,rx,ry,rz){var m=new T.Mesh(geo,mat);m.position.set(x,y,z);m.rotation.set(rx||0,ry||0,rz||0);g.add(m);
      var e=new T.LineSegments(new T.EdgesGeometry(geo),new T.LineBasicMaterial({color:new T.Color(col),transparent:true,opacity:0.6}));e.position.copy(m.position);e.rotation.copy(m.rotation);g.add(e);}
    if(fam==='injection'){add(new T.ConeGeometry(0.34,1.0,5),0,0.1,0);add(new T.ConeGeometry(0.2,0.6,5),0.3,0.35,0.07,0,0,0.5);}
    else if(fam==='secrets'){add(new T.IcosahedronGeometry(0.4,0),0,0,0);add(new T.TorusGeometry(0.22,0.07,8,16),0,0.5,0,Math.PI/2,0,0);}
    else if(fam==='crypto'){add(new T.BoxGeometry(0.62,0.62,0.62),0,0.05,0,0.5,0.6,0);}
    else if(fam==='container'){add(new T.BoxGeometry(0.72,0.46,0.6),0,0,0);add(new T.BoxGeometry(0.26,0.32,0.26),0.32,0.4,0.13);}
    else {add(new T.DodecahedronGeometry(0.34,0),0,0.1,0);}
    return g;
  }

  function runScan(){
    if(state.scored)return;
    state.scored=true;
    var found=0, fp=0, xpGain=0, caught=[], escaped=[], falses=[];
    FILES.forEach(function(f){
      var truth={}; f.vulns.forEach(function(v){truth[v.line]=v;});
      var c=0,m=0,p=0;
      f.vulns.forEach(function(v){
        if(f.flags[v.line]){c++;found++;xpGain+=SEV[v.sev].xp;state.fams[v.fam]++;caught.push({v:v,f:f}); if(v.fam==='secrets')state.firstBlood=true;}
        else {m++;escaped.push({v:v,f:f});}
      });
      Object.keys(f.flags).forEach(function(k){ if(!truth[+k]){p++;fp++;falses.push({f:f,line:+k});} });
      f.res={c:c,m:m,p:p,hasV:f.vulns.length>0};
      var pos=f.node.position;
      if(c>0)burst(new T.Vector3(pos.x,pos.y+1,pos.z),'#76e0a0',26);
      escaped.filter(function(x){return x.f===f;}).forEach(function(x){
        var mo=monsterMesh(x.v.fam,SEV[x.v.sev].color); mo.position.set(pos.x,pos.y+1.4,pos.z); scene.add(mo);
        reveals.push({g:mo,spin:0.8});
      });
    });
    var prev=Math.floor(state.totalXp/100); state.totalXp+=xpGain; var now=Math.floor(state.totalXp/100);
    if(state.firstBlood&&!state._fb){state._fb=true;toast('First Blood','ach','ti-trophy');}
    if(now>prev&&now>=5&&!state.veteran){state.veteran=true;toast('Veteran · reached level 5','ach','ti-trophy');}
    updateHUD();
    showScore(found,fp,xpGain,caught,escaped,falses);
  }

  function grade(found,fp){var rec=found/TOTAL_VULN; if(rec>=1&&fp===0)return'S'; if(rec>=0.8&&fp<=1)return'A'; if(rec>=0.6)return'B'; if(rec>=0.4)return'C'; return'D';}
  function showScore(found,fp,xpGain,caught,escaped,falses){
    state.view='score';
    var acc=Math.round(found/(TOTAL_VULN+fp)*100);
    var fchips=Object.keys(FAM).map(function(k){return '<span class="fc"><span class="g">'+FAM[k]+'</span>'+state.fams[k]+'</span>';}).join('');
    var list='';
    caught.forEach(function(x){list+='<div class="sr hit"><span class="tg tgh">caught</span> '+x.v.enemy+' <span class="mono">'+x.f.path+':'+x.v.line+'</span></div>';});
    escaped.forEach(function(x){list+='<div class="sr miss"><span class="tg tgm">missed</span> '+x.v.enemy+' <span class="mono">'+x.f.path+':'+x.v.line+'</span></div>';});
    falses.forEach(function(x){list+='<div class="sr fp"><span class="tg tgf">false</span> clean line <span class="mono">'+x.f.path+':'+x.line+'</span></div>';});
    document.getElementById('scorepanel').innerHTML=
      '<div class="grade">'+grade(found,fp)+'</div>'+
      '<div class="metrics">'+
        '<div class="mc"><div class="mn">'+found+'/'+TOTAL_VULN+'</div><div class="ml">found</div></div>'+
        '<div class="mc"><div class="mn">'+fp+'</div><div class="ml">false alarms</div></div>'+
        '<div class="mc"><div class="mn">'+acc+'%</div><div class="ml">accuracy</div></div>'+
        '<div class="mc"><div class="mn">+'+xpGain+'</div><div class="ml">XP</div></div>'+
      '</div>'+
      '<div class="fchips">'+fchips+'</div>'+
      '<div class="srlist">'+list+'</div>'+
      '<div class="sd">Deva: '+(found>=TOTAL_VULN?'Nothing escaped your eye.':(found>0?'Some slipped past. Sweep again.':'They are all still out there.'))+'</div>'+
      '<div class="sbtn"><button id="bReview"><i class="ti ti-search"></i> Review files</button><button id="bAgain"><i class="ti ti-refresh"></i> Hunt again</button></div>';
    document.getElementById('scorepanel').style.display='flex';
    document.getElementById('runbar').style.display='none';
    document.getElementById('bReview').onclick=function(){document.getElementById('scorepanel').style.display='none';state.view='score';};
    document.getElementById('bAgain').onclick=resetHunt;
  }

  function resetHunt(){
    FILES.forEach(function(f){f.flags={};f.seen=false;f.res=null;});
    reveals.forEach(function(r){scene.remove(r.g);}); reveals=[];
    state.scored=false; state._fb=false; state.fams={secrets:0,injection:0,crypto:0,container:0,misc:0}; state.firstBlood=false; state.view='map'; state.cur=-1;
    document.getElementById('scorepanel').style.display='none';
    document.getElementById('filepanel').style.display='none';
    document.getElementById('runbar').style.display='flex';
    famUpdate(); updateProgress(); devaSay('Walk the files. Find what does not belong.');
  }

  function updateProgress(){document.getElementById('progress').textContent='Files '+seenCount()+'/'+FILES.length+' · '+totalFlags()+' flagged';}
  function updateHUD(){var lvl=Math.floor(state.totalXp/100),into=state.totalXp%100;document.getElementById('lvl').textContent='Level '+lvl;document.getElementById('xptxt').textContent=into+' / 100 XP';document.getElementById('xpfill').style.width=into+'%';}
  function famUpdate(){var c=document.getElementById('fams');c.innerHTML='';Object.keys(FAM).forEach(function(k){var d=document.createElement('div');d.className='fam';d.innerHTML='<span class="g">'+FAM[k]+'</span><b>'+state.fams[k]+'</b>';c.appendChild(d);});}
  function toast(txt,cls,icon){var t=document.createElement('div');t.className='toast '+(cls==='ach'?'ach':'');t.innerHTML='<i class="ti '+icon+'"></i>'+txt;document.getElementById('toasts').appendChild(t);setTimeout(function(){t.style.transition='opacity .4s';t.style.opacity='0';setTimeout(function(){t.remove();},400);},2600);}
  function devaSay(s){document.getElementById('deva').innerHTML='<b>Deva:</b> '+s;}

  var hsel=document.getElementById('hunter');
  HUNTERS.forEach(function(h){var o=document.createElement('option');o.value=h.key;o.textContent=h.name;hsel.appendChild(o);});
  function applyHunter(h){state.hunter=h;document.getElementById('frame').style.setProperty('--accent',h.accent);document.getElementById('sigil').innerHTML=h.glyph;document.getElementById('hname').textContent=h.name;document.getElementById('htitle').textContent=h.title;}
  hsel.addEventListener('change',function(){applyHunter(HUNTERS.filter(function(x){return x.key===hsel.value;})[0]);});

  document.getElementById('fback').onclick=backFromFile;
  document.getElementById('runbtn').onclick=runScan;

  function resize(){W=stage.clientWidth||680;H=stage.clientHeight||460;camera.aspect=W/H;camera.updateProjectionMatrix();renderer.setSize(W,H,false);}
  window.addEventListener('resize',resize);

  function statusEmissive(f){
    if(state.scored&&f.res){
      if(f.res.hasV){ if(f.res.m>0)return f.res.c>0?'#caa23a':'#c0392b'; return f.res.p>0?'#caa23a':'#2f9e5e'; }
      return f.res.p>0?'#caa23a':'#2f6fae';
    }
    if(f.seen)return flagCount(f)>0?state.hunter.accent:'#46507a';
    return '#2a3050';
  }

  var clock=new T.Clock();
  function animate(){
    requestAnimationFrame(animate);
    var dt=clock.getDelta(),t=clock.getElapsedTime();
    applyCam();
    deva.rotation.y+=dt*0.3;deva.scale.setScalar(0.8+Math.sin(t*1.6)*0.05);deva.position.y=2.7+Math.sin(t*0.9)*0.14;
    devaLight.intensity=1.1+Math.sin(t*1.6)*0.25;
    FILES.forEach(function(f){
      var u=f.node.userData;
      f.node.position.y=u.baseY+Math.sin(t*1.1+u.phase)*0.08;
      u.mat.emissive.set(statusEmissive(f));
      u.mat.emissiveIntensity=0.45+(f===FILES[state.cur]&&state.view==='file'?0.4:(f.seen?0.2:0));
    });
    for(var ri=reveals.length-1;ri>=0;ri--){reveals[ri].g.rotation.y+=dt*reveals[ri].spin;reveals[ri].g.position.y+=Math.sin(t*2+ri)*0.002;}
    for(var b=bursts.length-1;b>=0;b--){var bu=bursts[b];bu.life+=dt;var arr=bu.pts.geometry.attributes.position.array;
      for(var j=0;j<bu.vel.length;j++){arr[j*3]+=bu.vel[j][0]*dt;arr[j*3+1]+=(bu.vel[j][1]-9.8*bu.life)*dt;arr[j*3+2]+=bu.vel[j][2]*dt;}
      bu.pts.geometry.attributes.position.needsUpdate=true;bu.pts.material.opacity=Math.max(0,1-bu.life/0.8);if(bu.life>0.8){scene.remove(bu.pts);bursts.splice(b,1);}}
    var showLabels=(state.view==='map'||state.view==='score');
    FILES.forEach(function(f){var el=f.el;if(!el)return;if(!showLabels){el.style.display='none';return;}
      var v=f.node.position.clone();v.y+=1.0;v.project(camera);if(v.z>1){el.style.display='none';return;}
      el.style.display='block';el.style.left=((v.x*0.5+0.5)*W)+'px';el.style.top=((-v.y*0.5+0.5)*H)+'px';});
    renderer.render(scene,camera);
  }

  applyHunter(HUNTERS[0]); famUpdate(); buildNodes(); updateProgress(); updateHUD(); resize(); applyCam(); animate();
  }
  var tries=0, iv=setInterval(function(){tries++;if(window.THREE){clearInterval(iv);boot();}else if(tries>160){clearInterval(iv);boot();}},30);
})();
</script>
